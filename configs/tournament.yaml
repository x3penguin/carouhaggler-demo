# RQ1 ablation: 4 seller variants x 3 personas x 20 scenarios (240 games).
# RQ2: add Agents C and D here when ready (see configs/models.yaml).
experiment_name: tournament
seed: 42
max_budget_usd: 10.00   # safety cap: review it against the pilot's real cost per game
models_file: configs/models.yaml
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 10
  max_parse_retries: 2

guardrails:
  floor_protection: false

matrix:
  listings: all
  seeds: [0]
  listing_sample: 20
  sellers:
    - {agent: prompted_seller, model: main_seller}
    - {agent: agentic_seller, model: main_seller, use_tools: true, use_planning: false, use_reflection: false}
    - {agent: agentic_seller, model: main_seller, use_tools: false, use_planning: true, use_reflection: false}
    - {agent: agentic_seller, model: main_seller, use_tools: true, use_planning: true, use_reflection: true}
  buyers:
    - {agent: llm_buyer, persona: fair, model: buyer_pool}
    - {agent: llm_buyer, persona: tough, model: buyer_pool}
    - {agent: llm_buyer, persona: lowballer, model: buyer_pool}

summary_group_by: [seller_agent, seller_model]
bootstrap: {n_boot: 2000, seed: 0}

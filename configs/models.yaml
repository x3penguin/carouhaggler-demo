# The models for every experiment, in one place. Fill in the SET_ME values before running:
# the runner refuses to start on a placeholder, or on a hosted model priced at $0, because
# the budget cap works from these prices. Prices are USD per million tokens.
models:
  # Hosted models were chosen on 7 Nov 2026 to fit a $6 budget for every run. The versions are what
  # OpenRouter served under each id on that date, and the prices are its list prices then.
  main_seller:            # hosted seller: RQ1, RQ3, RQ4, and the strong side of RQ5
    provider: openai_compatible
    model: anthropic/claude-haiku-5.5    # version claude-haiku-5.5-20261007
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.7
    max_tokens: 800       # it thinks before replying: at 300, 65 of 301 pilot replies were cut off (7 Nov)
    price_in_per_mtok: 0.10
    price_out_per_mtok: 0.50

  buyer_pool:             # stays the same across conditions; a weak buyer flatters every seller
    provider: openai_compatible
    model: openai/gpt-6-luna             # version gpt-6-luna-20260922; a different family from the seller
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.7
    max_tokens: 300
    price_in_per_mtok: 0.10
    price_out_per_mtok: 0.50

  judge:                  # a different model family from the sellers (self-preference bias)
    provider: openai_compatible
    model: xiaomi/mimo-v2.6-flash        # version mimo-v2.6-flash-20260921
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    temperature: 0.7
    max_tokens: 600
    price_in_per_mtok: 0.14
    price_out_per_mtok: 0.28

  weak:                   # weak side of RQ5, on Ollama: `ollama pull qwen2.5:3b`
    provider: openai_compatible
    model: qwen2.5:3b
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    temperature: 0.7
    max_tokens: 300
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0

  finetuned:              # RQ2, Agents C and D, on Ollama: created in finetune/README.md step 3
    provider: openai_compatible
    model: qwen2.5-3b-haggle
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    temperature: 0.7
    max_tokens: 300
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0

  finetuned_dpo:          # RQ2 v2: the SFT model further trained with DPO (Fayaz, 9 Nov). On Ollama:
    provider: openai_compatible   # `ollama create qwen2.5-3b-haggle-dpo -f Modelfile` next to the GGUF
    model: qwen2.5-3b-haggle-dpo  # qwen2.5-3b-haggle-dpo-q4_k_m.gguf, SHA-256 281be40d...c950c9f
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    temperature: 0.7
    max_tokens: 300
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0

  finetuned_dpo_v3:       # RQ2 v3: DPO retrained with close pairs (finetune/DPO_V3.md; Fayaz, 10 Nov). On Ollama:
    provider: openai_compatible      # `ollama create qwen2.5-3b-haggle-dpo-v3 -f Modelfile` next to the GGUF
    model: qwen2.5-3b-haggle-dpo-v3  # qwen2.5-3b-haggle-dpo-v3-q4_k_m.gguf, SHA-256 2c98a505...d1d8240a
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    temperature: 0.7
    max_tokens: 300
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0
  finetuned_dpo_v4:       # RQ2 v4: DPO on two-way floor twins + SFT term (finetune/DPO_V3.md §7; Fayaz, 11 Nov). On Ollama:
    provider: openai_compatible      # `ollama create qwen2.5-3b-haggle-dpo-v4 -f Modelfile` next to the GGUF
    model: qwen2.5-3b-haggle-dpo-v4  # qwen2.5-3b-haggle-dpo-v4-q4_k_m.gguf, SHA-256 1aa7a7c6...a044ec37
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    temperature: 0.7
    max_tokens: 300
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0

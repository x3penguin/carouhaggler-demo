# RQ1 on the fine-tuned model: the two middle designs (A + price tool, A + planning) that tournament_finetuned.yaml
# left out (120 games). Pooled with that run, the fine-tuned model has all 4 designs on the same games as Haiku.
# Keep seed, seeds, listing_sample and buyers the same as tournament.yaml.
experiment_name: tournament_finetuned_ablation
seed: 42
max_budget_usd: 0.30   # only the buyers cost money (local seller); ~$0.0011 per game in tournament_finetuned
models_file: configs/models.yaml
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 10
  max_parse_retries: 2

guardrails:
  floor_protection: false

matrix:
  listings: all
  seeds: [0]
  listing_sample: 20
  sellers:
    - {agent: agentic_seller, model: finetuned, use_tools: true, use_planning: false, use_reflection: false}
    - {agent: agentic_seller, model: finetuned, use_tools: false, use_planning: true, use_reflection: false}
  buyers:
    - {agent: llm_buyer, persona: fair, model: buyer_pool}
    - {agent: llm_buyer, persona: tough, model: buyer_pool}
    - {agent: llm_buyer, persona: lowballer, model: buyer_pool}

summary_group_by: [seller_agent, seller_model]
bootstrap: {n_boot: 2000, seed: 0}

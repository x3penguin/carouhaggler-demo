# Phase 1 pilot: Agent A vs fair/tough/lowballer (51 games), to measure the real cost per game.
experiment_name: pilot
seed: 42
max_budget_usd: 2.00   # safety cap: review it against the pilot's real cost per game
models_file: configs/models.yaml
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 10
  max_parse_retries: 2

guardrails:
  floor_protection: false

matrix:
  listings: all
  seeds: [0]
  listing_sample: 17
  sellers:
    - {agent: prompted_seller, model: main_seller}
  buyers:
    - {agent: llm_buyer, persona: fair, model: buyer_pool}
    - {agent: llm_buyer, persona: tough, model: buyer_pool}
    - {agent: llm_buyer, persona: lowballer, model: buyer_pool}

summary_group_by: [seller_agent, seller_model, buyer_persona]
bootstrap: {n_boot: 2000, seed: 0}

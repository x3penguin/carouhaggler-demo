# RQ6, no-competition baseline: sellers A and B x 20 listings, one tough buyer each (40 markets, 40 chats).
# Same listings, floors and seller as extension.yaml; the lone buyer has the same budget and deadline
# as buyer 1 there, so each market is compared with its own competition twin.
# Runs through the same multi-buyer code path, so the only difference is the number of rivals.
experiment_name: extension_solo
seed: 42
max_budget_usd: 5.00   # safety cap: review it against the pilot's real cost per game
models_file: configs/models.yaml
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 10
  max_parse_retries: 2

guardrails:
  floor_protection: false

matrix:
  seeds: [0]
  markets:
    listing_sample: 20
    deadline_days: 7
    buyers_see_competing_offers: false
    buyer_sets:
      - - {agent: llm_buyer, persona: tough, model: buyer_pool, deadline: normal, arrival_hours: 0}
  sellers:
    - {agent: prompted_seller, model: main_seller}
    - {agent: agentic_seller, model: main_seller}

summary_group_by: [seller_agent, buyer_persona]
bootstrap: {n_boot: 2000, seed: 0}

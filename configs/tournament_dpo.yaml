# RQ2 v2: the DPO model with all 4 designs (A, A+tools, A+plan, B) x 3 personas x 20 scenarios (240 games),
# the same games as tournament.yaml, tournament_finetuned.yaml and tournament_base.yaml.
# Keep seed, seeds, listing_sample and buyers the same as tournament.yaml.
experiment_name: tournament_dpo
seed: 42
max_budget_usd: 0.60   # only the buyers cost money (local seller); ~$0.0011 per game in tournament_finetuned
models_file: configs/models.yaml
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 10
  max_parse_retries: 2

guardrails:
  floor_protection: false

matrix:
  listings: all
  seeds: [0]
  listing_sample: 20
  sellers:
    - {agent: prompted_seller, model: finetuned_dpo}
    - {agent: agentic_seller, model: finetuned_dpo, use_tools: true, use_planning: false, use_reflection: false}
    - {agent: agentic_seller, model: finetuned_dpo, use_tools: false, use_planning: true, use_reflection: false}
    - {agent: agentic_seller, model: finetuned_dpo, use_tools: true, use_planning: true, use_reflection: true}
  buyers:
    - {agent: llm_buyer, persona: fair, model: buyer_pool}
    - {agent: llm_buyer, persona: tough, model: buyer_pool}
    - {agent: llm_buyer, persona: lowballer, model: buyer_pool}

summary_group_by: [seller_agent, seller_model]
bootstrap: {n_boot: 2000, seed: 0}

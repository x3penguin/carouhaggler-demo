# Config for the interactive demo (app/demo.py).
experiment_name: demo
seed: 42
max_budget_usd: 0.0          # local model, so nothing is spent
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 50
  max_parse_retries: 2

guardrails:
  floor_protection: false    # default for the demo; toggled live in the sidebar

seller:
  agent: prompted_seller
  model: local_small

buyer:
  model: local_small         # used only for autoplay
  persona: fair

models:
  local_small:
    provider: openai_compatible
    model: qwen2.5:3b
    base_url: http://localhost:11434/v1
    api_key_env: OLLAMA_API_KEY
    temperature: 0.7
    max_tokens: 300
    price_in_per_mtok: 0.0
    price_out_per_mtok: 0.0

# Example hosted model through OpenRouter (OpenAI-compatible). Not used by the demo.

# RQ3: 50 attack scripts and 50 plain twins x sellers A and B x defences off/on (400 games).
experiment_name: attacks
seed: 42
max_budget_usd: 5.00   # safety cap: review it against the pilot's real cost per game
models_file: configs/models.yaml
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 10
  max_parse_retries: 2

guardrails:
  floor_protection: false

matrix:
  listings: all
  seeds: [0]
  listing_sample: 1
  sellers:
    - {agent: prompted_seller, model: main_seller}
    - {agent: prompted_seller, model: main_seller, injection_defense: true,
       guard: {leak_filter: true, grounding: block}}
    - {agent: agentic_seller, model: main_seller}
    - {agent: agentic_seller, model: main_seller, injection_defense: true,
       guard: {leak_filter: true, grounding: block}}
  buyers:
    - {agent: attacks, categories: all, twins: true}

summary_group_by: [seller_agent, attack_category, attack_kind]
bootstrap: {n_boot: 2000, seed: 0}

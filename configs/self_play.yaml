# Self-play calibration: same model both sides, so seller surplus should be near 0.5 (60 games).
experiment_name: self_play
seed: 42
max_budget_usd: 3.00   # safety cap: review it against the pilot's real cost per game
models_file: configs/models.yaml
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 10
  max_parse_retries: 2

guardrails:
  floor_protection: true

matrix:
  listings: all
  seeds: [0]
  listing_sample: 30
  self_play: true
  sellers:
    - {agent: prompted_seller, model: main_seller}
    - {agent: prompted_seller, model: weak}
  buyers:
    - {agent: llm_buyer, persona: fair}

summary_group_by: [seller_agent, seller_model, buyer_model]
bootstrap: {n_boot: 2000, seed: 0}

# Counterfactual replay: recorded pilot buyer turns replayed against sellers A and B (60 games).
# Uses the newest run under runs/pilot; give a timestamped path to pin one.
experiment_name: replay
seed: 42
max_budget_usd: 3.00   # safety cap: review it against the pilot's real cost per game
models_file: configs/models.yaml
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 10
  max_parse_retries: 2

guardrails:
  floor_protection: false

matrix:
  replay:
    source: runs/pilot
    max_games: 30
  sellers:
    - {agent: prompted_seller, model: main_seller}
    - {agent: agentic_seller, model: main_seller}

summary_group_by: [seller_agent, seller_model]
bootstrap: {n_boot: 2000, seed: 0}

# RQ5: strong vs weak model, same design, both role assignments (120 games). Needs Ollama for the weak side.
experiment_name: asymmetry
seed: 42
max_budget_usd: 5.00   # safety cap: review it against the pilot's real cost per game
models_file: configs/models.yaml
listings_path: data/listings_sg.json
log_dir: runs

engine:
  max_turns_per_side: 10
  max_parse_retries: 2

guardrails:
  floor_protection: true

matrix:
  listings: all
  seeds: [0]
  listing_sample: 30
  sellers:
    - {agent: prompted_seller, model: main_seller}
    - {agent: prompted_seller, model: weak}
  buyers:
    - {agent: llm_buyer, persona: fair, model: main_seller}
    - {agent: llm_buyer, persona: fair, model: weak}

summary_group_by: [seller_model, buyer_model]
bootstrap: {n_boot: 2000, seed: 0}
